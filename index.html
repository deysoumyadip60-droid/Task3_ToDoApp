<!DOCTYPE html>
<html lang="en" data-theme="neon">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - To-Do Web App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="fx"></canvas>
    <div class="aurora"></div>

    <main class="app">
        <header class="top">
            <div>
                <h1>QuestList</h1>
                <p id="greeting"></p>
            </div>
            <div class="themes" id="themes" aria-label="Theme">
                <button data-t="neon" title="Neon"></button>
                <button data-t="aurora" title="Aurora"></button>
                <button data-t="sunset" title="Sunset"></button>
            </div>
        </header>

        <section class="card hero">
            <div class="ring">
                <svg viewBox="0 0 80 80">
                    <circle class="bg" cx="40" cy="40" r="34"/>
                    <circle class="fg" id="ringFg" cx="40" cy="40" r="34"/>
                </svg>
                <b id="lvl">1</b>
            </div>
            <div class="hero-info">
                <div class="rank-row"><strong id="rank">Rookie</strong><span id="xpTxt">0 / 100 XP</span></div>
                <div class="bar"><i id="xpFill"></i></div>
                <div class="chips">
                    <span class="chip">🔥 <b id="streak">0</b> day streak</span>
                    <span class="chip">📋 <b id="sActive">0</b> active</span>
                    <span class="chip">✅ <b id="sDone">0</b> done</span>
                    <span class="chip">🎯 <b id="sRate">0%</b> complete</span>
                </div>
            </div>
        </section>

        <form id="addForm" class="card add">
            <input id="taskInput" placeholder="Add a new quest... (press / to focus)" autocomplete="off">
            <select id="prioritySelect" aria-label="Priority">
                <option value="low">🟢 Low +10 XP</option>
                <option value="medium" selected>🟡 Medium +20 XP</option>
                <option value="high">🔴 High +30 XP</option>
            </select>
            <input type="date" id="dueDateInput" aria-label="Due date">
            <button class="go">Add quest</button>
        </form>

        <div class="toolbar">
            <input id="search" type="search" placeholder="🔍 Search quests">
            <div class="tabs" id="tabs">
                <button data-f="active" class="on">Active</button>
                <button data-f="done">Done</button>
                <button data-f="all">All</button>
            </div>
        </div>

        <ul id="list" class="list"></ul>

        <footer class="foot">
            <button id="clearDone" class="ghost">Clear completed</button>
            <button id="exportBtn" class="ghost">Export backup</button>
        </footer>
    </main>

    <div id="toast"></div>
    <script src="script.js"></script>
</body>
</html>
